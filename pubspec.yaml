name: cloud_gallery
description: Cloud Gallery — Manage, organize, and back up photos & videos from local storage, Google Drive, and Dropbox.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local media
  photo_manager: ^3.6.4
  permission_handler: ^11.4.0

  # Google Sign-In + Drive
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # HTTP for Dropbox + general
  dio: ^5.8.0+1
  http: ^1.3.0

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # UI & utilities
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  uuid: ^4.5.1
  crypto: ^3.0.6
  collection: ^1.19.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
