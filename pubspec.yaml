name: cloud_gallery
description: Keep all your photos and videos in one place — device + Google Drive.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3

  # Firebase Auth + Google Sign-In
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2

  # Google Drive (uses Google Sign-In tokens — NOT Firebase tokens)
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  googleapis: ^13.2.0
  http: ^1.2.2

  # Local media
  photo_manager: ^3.6.0
  permission_handler: ^11.3.1

  # Media display & download
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  path_provider: ^2.1.5
  dio: ^5.7.0
  intl: ^0.19.0
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  photo_manager_image_provider: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
